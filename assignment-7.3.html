<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment 7.3 - Responsive Product Listing</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: #f3f5f2;
    color: #1c2a26;
    padding: 2rem 1.25rem 3rem;
  }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-size: 2rem; }
  header p { color: #5d6b66; }

  /* Flex container: wraps cards onto new lines, gap adds spacing */
  .products {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* Flex item sizing (the flex shorthand = grow shrink basis):
     flex-grow: 1    -> cards share leftover space on a row
     flex-shrink: 1  -> cards may shrink if needed
     flex-basis: 260px -> ideal starting width; when a row can't fit
                          another 260px card, it wraps to the next line */
  .card {
    flex-grow: 1;
    flex-shrink: 1;
    flex-basis: 260px;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #cfd8d3;
    border-radius: 10px;
    overflow: hidden;
  }
  .card-img { display: block; width: 100%; height: auto; }
  .card-body {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    padding: 1.25rem;
  }
  .card h2 { font-size: 1.1rem; margin-bottom: .35rem; }
  .price { font-size: 1.35rem; font-weight: 700; color: #1f6f5c; margin-bottom: 1rem; }
  button {
    margin-top: auto;
    font: inherit;
    font-weight: 600;
    padding: .7rem 1rem;
    border: 0;
    border-radius: 6px;
    background: #1f6f5c;
    color: #fff;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }
</style>
</head>
<body>

<header>
  <h1>Shop products</h1>
  <p>Resize the window to watch the cards wrap.</p>
</header>

<main class="products">

    <article class="card">
      <svg class="card-img" viewBox="0 0 220 200" role="img" aria-label="Wireless Headphones"><rect width="220" height="200" fill="#dfe9e4"/><path d="M60 120v-20a50 50 0 0 1 100 0v20" fill="none" stroke="#1f6f5c" stroke-width="10"/><rect x="48" y="115" width="26" height="45" rx="10" fill="#1f6f5c"/><rect x="146" y="115" width="26" height="45" rx="10" fill="#1f6f5c"/></svg>
      <div class="card-body">
        <h2>Wireless Headphones</h2>
        <p class="price">$79.99</p>
        <button type="button">Add to cart</button>
      </div>
    </article>

    <article class="card">
      <svg class="card-img" viewBox="0 0 220 200" role="img" aria-label="Smart Watch"><rect width="220" height="200" fill="#e8e4f0"/><rect x="85" y="30" width="50" height="30" fill="#6b5b95"/><rect x="85" y="140" width="50" height="30" fill="#6b5b95"/><rect x="70" y="55" width="80" height="90" rx="18" fill="#3d3357"/><circle cx="110" cy="100" r="22" fill="none" stroke="#e8e4f0" stroke-width="5"/><path d="M110 100V86M110 100l10 6" stroke="#e8e4f0" stroke-width="4"/></svg>
      <div class="card-body">
        <h2>Smart Watch</h2>
        <p class="price">$149.00</p>
        <button type="button">Add to cart</button>
      </div>
    </article>

    <article class="card">
      <svg class="card-img" viewBox="0 0 220 200" role="img" aria-label="Everyday Backpack"><rect width="220" height="200" fill="#f2e8d9"/><rect x="70" y="45" width="80" height="110" rx="26" fill="#b5783a"/><rect x="82" y="105" width="56" height="34" rx="8" fill="#8f5a24"/><path d="M92 48a18 18 0 0 1 36 0" fill="none" stroke="#8f5a24" stroke-width="7"/></svg>
      <div class="card-body">
        <h2>Everyday Backpack</h2>
        <p class="price">$54.50</p>
        <button type="button">Add to cart</button>
      </div>
    </article>

    <article class="card">
      <svg class="card-img" viewBox="0 0 220 200" role="img" aria-label="Steel Water Bottle"><rect width="220" height="200" fill="#dcebf2"/><rect x="95" y="30" width="30" height="22" rx="5" fill="#2f6f8f"/><rect x="82" y="50" width="56" height="110" rx="16" fill="#4a9cc2"/><rect x="82" y="85" width="56" height="14" fill="#2f6f8f"/></svg>
      <div class="card-body">
        <h2>Steel Water Bottle</h2>
        <p class="price">$24.00</p>
        <button type="button">Add to cart</button>
      </div>
    </article>

    <article class="card">
      <svg class="card-img" viewBox="0 0 220 200" role="img" aria-label="Desk Lamp"><rect width="220" height="200" fill="#f6efc9"/><path d="M80 160h60M110 160V90l30-40" fill="none" stroke="#8a7a1c" stroke-width="8"/><path d="M125 40l35 18-14 24z" fill="#d4b929"/></svg>
      <div class="card-body">
        <h2>Desk Lamp</h2>
        <p class="price">$39.99</p>
        <button type="button">Add to cart</button>
      </div>
    </article>

    <article class="card">
      <svg class="card-img" viewBox="0 0 220 200" role="img" aria-label="Running Sneakers"><rect width="220" height="200" fill="#f4dcdc"/><path d="M45 125c25 0 30-30 48-30 12 22 35 18 62 28 12 4 22 10 22 22H45z" fill="#c0504d"/><rect x="45" y="145" width="132" height="10" rx="5" fill="#7a2523"/></svg>
      <div class="card-body">
        <h2>Running Sneakers</h2>
        <p class="price">$89.00</p>
        <button type="button">Add to cart</button>
      </div>
    </article>
</main>

</body>
</html>
